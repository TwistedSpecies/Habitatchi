<script>
let t,n=0;function go(q){clearInterval(t);let a=[...document.querySelectorAll('.f')].filter(x=>x.dataset.q==q);n=0;document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));a[0].classList.add('on');document.querySelector('#s').textContent=(q=='i'?'Idle':q=='feed'?'Feeding':q=='happy'?'Happy':'Sleeping')+' — '+a.length+' drawn frames';t=setInterval(()=>{n++;if(n>=a.length){clearInterval(t);if(q=='feed')go('happy');else n=0}document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));a[n%a.length].classList.add('on')},q=='sleep'?700:430)}go('i');
</script>
