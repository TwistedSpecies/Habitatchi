<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211e1d"><title>Milo — 3D Cat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211e1d;color:#f5eee6;font-family:system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,#100e0d66 100%)}header{position:fixed;top:22px;left:22px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.22em;color:#d6ae7e;text-transform:uppercase}h1{font:400 48px/1 Georgia,serif;margin:7px 0}header p{font-size:12px;color:#d1c3b8;margin:0}.panel{position:fixed;right:18px;top:18px;width:180px;padding:14px;border:1px solid #ffffff24;border-radius:15px;background:#211e1dc9;backdrop-filter:blur(14px)}.paneltop,.statline{display:flex;justify-content:space-between;font-size:10px;color:#d8c9bd}.paneltop{margin-bottom:12px}.mood{color:#edc18c}.stat{margin:9px 0}.statline{margin-bottom:5px}.bar{height:4px;background:#ffffff20;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b78254,#f0cf9e);border-radius:8px}.actions{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;border-radius:16px;border:1px solid #ffffff26;background:#211e1ddd;backdrop-filter:blur(15px);max-width:calc(100vw - 18px)}button{border:0;border-radius:10px;padding:11px 13px;background:transparent;color:#f5eee6;font-size:12px;white-space:nowrap}button.selected{background:#e8bd87;color:#241b15}.hint{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);font-size:10px;color:#d7ccc3;white-space:nowrap}#msg{position:fixed;top:25%;left:50%;transform:translateX(-50%);opacity:0;background:#211e1de8;border:1px solid #ffffff25;padding:10px 16px;border-radius:30px;font-size:12px;white-space:nowrap;transition:.2s}#msg.show{opacity:1}#error{display:none;position:fixed;inset:0;background:#211e1d;color:white;padding:30px;align-content:center;text-align:center}@media(max-width:600px){h1{font-size:39px}.panel{top:100px;right:10px;width:150px;padding:11px}.actions{width:calc(100% - 16px);justify-content:space-around}.actions button{font-size:11px;padding:10px 8px}}
</style></head><body>
<canvas id="c"></canvas><div class="shade"></div><header><div class="eyebrow">A little life, in 3D</div><h1>Milo</h1><p>Your curious little companion</p></header>
<section class="panel"><div class="paneltop"><span>HOW MILO FEELS</span><span class="mood" id="mood">Content</span></div>
<div class="stat"><div class="statline"><span>HUNGER</span><span id="foodN">72%</span></div><div class="bar"><i id="food" style="width:72%"></i></div></div>
<div class="stat"><div class="statline"><span>AFFECTION</span><span id="loveN">68%</span></div><div class="bar"><i id="love" style="width:68%"></i></div></div>
<div class="stat"><div class="statline"><span>ENERGY</span><span id="energyN">84%</span></div><div class="bar"><i id="energy" style="width:84%"></i></div></div></section>
<div id="msg">Milo purrs softly</div><div class="hint">Drag to turn · Pinch to zoom · Tap Milo</div>
<nav class="actions"><button class="selected" data-a="stroke">♡ Stroke</button><button data-a="play">✳ Play</button><button data-a="feed">＋ Feed</button><button data-a="nap">☾ Nap</button></nav><div id="error">The 3D library could not load. Check your internet connection and open this page in Safari.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as T from "three";
try{
const c=document.querySelector("#c"),r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;
const s=new T.Scene();s.background=new T.Color("#282426");s.fog=new T.Fog("#282426",9,20);
const cam=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,50),target=new T.Vector3(0,1.1,0);let rad=7.4,az=.55,pol=1.18;
function camera(){pol=T.MathUtils.clamp(pol,.6,1.48);rad=T.MathUtils.clamp(rad,4,10);cam.position.set(rad*Math.sin(pol)*Math.sin(az),1.1+rad*Math.cos(pol),rad*Math.sin(pol)*Math.cos(az));cam.lookAt(target)}camera();
s.add(new T.HemisphereLight(0xcbd9e8,0x644b3c,1.7));let sun=new T.DirectionalLight(0xffdfbf,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);s.add(sun);let rim=new T.DirectionalLight(0x9db6d8,2);rim.position.set(4,4,-5);s.add(rim);
let floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:"#514a49",roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;s.add(floor);
function mat(col,rough=.9){return new T.MeshStandardMaterial({color:col,roughness:rough})}
const ginger=mat("#b87948"),cream=mat("#e1c9aa"),brown=mat("#523a30"),pink=mat("#a65d5c",.5),gold=mat("#b5a15c",.18),black=mat("#171313",.2),glint=new T.MeshBasicMaterial({color:"#fff5e8"});
const cat=new T.Group();s.add(cat);
function ball(parent,m,p,z){let o=new T.Mesh(new T.SphereGeometry(1,36,28),m);o.position.set(...p);o.scale.set(...z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function tube(parent,pts,rad,m){let curve=new T.CatmullRomCurve3(pts.map(p=>new T.Vector3(...p)));let o=new T.Mesh(new T.TubeGeometry(curve,32,rad,8,false),m);o.castShadow=true;parent.add(o);return o}
ball(cat,ginger,[0,1,-.05],[.67,.72,1.03]);ball(cat,cream,[0,.85,.63],[.47,.57,.4]);ball(cat,ginger,[0,1.45,.55],[.46,.54,.48]);
const h=new T.Group();h.position.set(0,2.02,.75);cat.add(h);ball(h,ginger,[0,0,0],[.59,.53,.49]);ball(h,cream,[0,-.24,.33],[.43,.25,.24]);
for(let side of [-1,1]){let ear=ball(h,ginger,[side*.39,.42,-.01],[.22,.37,.15]);ear.rotation.z=-side*.25;let inn=ball(h,pink,[side*.39,.43,.11],[.12,.24,.035]);inn.rotation.z=-side*.25;ball(h,brown,[side*.235,.055,.405],[.175,.14,.1]);ball(h,gold,[side*.235,.055,.48],[.11,.1,.045]);ball(h,black,[side*.235,.055,.52],[.036,.085,.02]);ball(h,glint,[side*.265,.09,.54],[.025,.025,.012])}
ball(h,cream,[-.1,-.22,.51],[.17,.13,.15]);ball(h,cream,[.1,-.22,.51],[.17,.13,.15]);ball(h,pink,[0,-.145,.64],[.07,.05,.04]);tube(h,[[0,-.18,.64],[0,-.28,.64],[-.09,-.32,.62]],.008,brown);tube(h,[[0,-.28,.64],[.09,-.32,.62]],.008,brown);
for(let side of [-1,1])for(let i=0;i<3;i++){let y=-.2-i*.06;tube(h,[[side*.18,y,.53],[side*.43,y+(i-1)*.04,.56],[side*.74,y+(i-1)*.1,.52]],.003,cream)}
for(let x of [-.42,.42])for(let z of [-.62,.67]){let leg=new T.Group();leg.position.set(x,.7,z);cat.add(leg);ball(leg,ginger,[0,-.23,0],[.19,.46,.2]);ball(leg,ginger,[0,-.5,.08],[.2,.15,.27])}
let tailCurve=new T.CatmullRomCurve3([[.45,1.05,-.82],[.8,1.15,-1.1],[1.02,1.4,-1.35],[1.02,1.8,-1.45],[.82,2,-1.45],[.62,1.94,-1.45]].map(p=>new T.Vector3(...p)));let tail=new T.Mesh(new T.TubeGeometry(tailCurve,55,.105,14,false),ginger);tail.castShadow=true;cat.add(tail);cat.position.y=.1;
const stats={food:72,love:68,energy:84};let mode="idle",until=0,clock=new T.Clock(),elapsed=0;
function refresh(){for(let k in stats){document.getElementById(k).style.width=stats[k]+"%";document.getElementById(k+"N").textContent=Math.round(stats[k])+"%"}document.getElementById("mood").textContent=stats.energy<25?"Sleepy":stats.food<25?"Hungry":mode==="play"?"Playful":mode==="nap"?"Drowsy":"Content"}
function act(a){if(a==="stroke"){stats.love=Math.min(100,stats.love+9);mode="purr";say("Milo leans into your hand and purrs")}if(a==="play"){stats.energy=Math.max(0,stats.energy-12);stats.love=Math.min(100,stats.love+7);mode="play";say("Milo is feeling playful")}if(a==="feed"){stats.food=Math.min(100,stats.food+28);mode="eat";say("Milo crunches happily")}if(a==="nap"){stats.energy=Math.min(100,stats.energy+12);mode="nap";say("Milo curls up for a nap")}until=performance.now()+5000;refresh()}
function say(t){let e=document.getElementById("msg");e.textContent=t;e.classList.add("show");clearTimeout(say.timer);say.timer=setTimeout(()=>e.classList.remove("show"),1700)}
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-a]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");act(b.dataset.a)});
let down=null,moved=false;c.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};moved=false;c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(!down)return;let dx=e.clientX-down.px,dy=e.clientY-down.py;if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>5)moved=true;az-=dx*.008;pol+=dy*.006;down.px=e.clientX;down.py=e.clientY;camera()});c.addEventListener("pointerup",e=>{if(down&&!moved){let v=new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new T.Raycaster();ray.setFromCamera(v,cam);if(ray.intersectObject(cat,true).length)act("stroke")}down=null});c.addEventListener("wheel",e=>{rad+=e.deltaY*.006;camera()},{passive:true});
let pinch=0;c.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});c.addEventListener("touchmove",e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);rad-=(d-pinch)*.012;pinch=d;camera()}},{passive:true});
function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04);elapsed+=dt;let t=elapsed;cat.position.y=.1+Math.sin(t*1.7)*.012;h.rotation.y=Math.sin(t*.5)*.035;h.rotation.x=Math.sin(t)*.015;tail.rotation.z=Math.sin(t*1.2)*.12;if(performance.now()>until)mode="idle";if(mode==="purr")cat.position.y+=Math.sin(t*12)*.008;if(mode==="play"){cat.position.y+=Math.abs(Math.sin(t*5))*.04;tail.rotation.z=Math.sin(t*6)*.2}if(mode==="nap")h.rotation.x=.2;if(Math.floor(t/60)>Math.floor((t-dt)/60)){stats.food=Math.max(0,stats.food-.4);stats.energy=Math.max(0,stats.energy-.2);refresh()}r.render(s,cam)}frame();
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
}catch(err){console.error(err);document.getElementById("error").style.display="grid"}
</script></body></html>
